plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '2.0.0'
group = 'com.packcompanion'

base { archivesName = 'packcompanion-1.20.1' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    // 官方映射，1.20.1
    mappings channel: 'official', version: '1.20.1'
}

repositories {
    // 本地仓库：Mixin 主 jar + 注解处理器（网络下载不稳定，离线解析）
    maven { url = uri("${projectDir}/repo") }
    // GTM 官方 maven（备用；主要编译依赖来自 libs/ 内的整合包实机 jar）
    maven { url = 'https://maven.gtceu.com' }
    maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'

    // GTM addon 依赖：直接对齐 GTSW 整合包内实机 jar（官方映射，无需 deobf）
    implementation files('libs/gtceu-1.20.1-7.5.3.jar')
    implementation files('libs/ldlib-forge-1.20.1-1.0.50.jar')
    implementation files('libs/Registrate-MC1.20-1.3.11.jar')
    // Jade HUD（可选集成：仅编译期使用，运行时由整合包内的 Jade 提供）
    implementation files('libs/Jade-1.20.1-Forge-11.13.2.jar')
    // gtna（Nexus Terminal）：仅编译期引用其类，运行时由整合包提供
    implementation files('libs/gtna-0.5.1.jar')
    // JEI：仅编译期引用（MultiblockInfoCategory mixin 需要 mezz.* 类型），运行时由整合包提供
    implementation files('libs/jei-1.20.1-forge-15.20.0.132.jar')
    // ShoulderSurfing（越肩视角）：仅编译期引用（ShoulderSurfingCamera mixin），运行时由整合包提供
    implementation files('libs/ShoulderSurfing-Forge-1.20.1-5.2.0.jar')
    // 车万女仆（touhoulittlemaid）：仅编译期引用（失重漂浮跟随 mixin），运行时由整合包提供
    implementation files('libs/touhoulittlemaid-1.5.3-forge+mc1.20.1.jar')
    // AE2 + ae2wtlib：仅编译期引用（女仆 GUI 无线终端按钮），运行时由整合包提供
    implementation files('libs/appliedenergistics2-forge-15.4.10.jar')
    implementation files('libs/ae2wtlib-15.3.3-forge.jar')

    // Mixin 注解（Forge 1.20.1 自带 0.8.5 运行时）
    compileOnly 'org.spongepowered:mixin:0.8.5'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : 'packcompanion',
                'Specification-Vendor'  : 'packcompanion',
                'Specification-Version' : '1',
                'Implementation-Title'  : 'Pack Companion',
                'Implementation-Version': project.version,
                'MixinConfigs'          : 'packcompanion.mixins.json,packcompanion.client.mixins.json,packcompanion.tlm.mixins.json'
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Forge 1.20.1 生产环境为 SRG 命名，发布 jar 必须 reobf
jar.finalizedBy('reobfJar')
